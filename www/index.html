<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dead Tide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d1424">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: full-screen WebGL scene; HUD strip on top; menus as bottom sheets so the 3D squad stays visible. Single night look by design. */
:root{
  --night:#0d1424; --ink:#f4f1e8; --muted:#aab6cf; --hazard:#ffc531; --good:#2f8cff; --bad:#ff4a3d;
  --panel:rgba(12,18,33,.9); --line:rgba(255,255,255,.14);
  --display:"Bungee","Impact","Arial Black",sans-serif; --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{position:fixed;inset:0;background:var(--night)}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:0;pointer-events:none;padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.toprow{display:flex;align-items:center;gap:10px}
.lv{font-family:var(--display);font-size:13px;background:var(--hazard);color:#1d1500;padding:6px 9px;border-radius:6px;box-shadow:0 3px 0 #8f6a00;white-space:nowrap}
.prog{flex:1;height:10px;border-radius:7px;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.28);position:relative;margin-right:10px}
.prog i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:linear-gradient(90deg,#ffe58f,var(--hazard))}
.prog b{position:absolute;right:-12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--bad);border:2px solid #fff;
  display:grid;place-items:center;font:800 10px var(--body);color:#fff}
.coins{font-family:var(--display);font-size:14px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.5);padding:4px 10px 4px 5px;border-radius:20px;font-variant-numeric:tabular-nums}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff4c0,#ffc531 55%,#a87600);box-shadow:inset 0 0 0 2px #7a5500;flex:none}
.iconbtn{pointer-events:auto;width:38px;height:38px;border-radius:8px;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);color:var(--ink);
  font:800 15px var(--body);display:grid;place-items:center;cursor:pointer;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:0}
.chip{font-family:var(--display);font-size:11px;padding:5px 9px 8px;border-radius:6px;background:rgba(0,0,0,.6);border:2px solid var(--c);color:var(--c);position:relative;overflow:hidden}
.chip i{position:absolute;left:0;bottom:0;height:3px;background:var(--c)}
.pwr{width:38px;height:38px;border-radius:50%;padding:3px;background:conic-gradient(var(--c) var(--p,100%),rgba(0,0,0,.55) 0);box-shadow:0 2px 6px rgba(0,0,0,.5);position:relative}
.pwr img{width:100%;height:100%;border-radius:50%;background:rgba(10,12,18,.88);display:block;padding:4px;box-sizing:border-box}
.pwr.end{animation:pwrblink .25s steps(2) infinite}
@keyframes pwrblink{50%{opacity:.35}}
.bossbar{display:flex;flex-direction:column;gap:3px;align-items:stretch;max-width:420px;width:100%;align-self:center}
.bossbar span{font-family:var(--display);font-size:12px;color:#ffd0c8;text-align:center;letter-spacing:.06em;text-shadow:0 2px 0 #000}
.bossbar div{height:12px;border-radius:7px;background:rgba(0,0,0,.6);border:2px solid #fff;overflow:hidden}
.bossbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#b3160b,var(--bad))}
.bubble{position:absolute;left:0;top:0;pointer-events:none;font-family:var(--display);font-size:19px;background:var(--good);color:#fff;padding:2px 12px 3px;border-radius:14px;
  border:2px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.35);will-change:transform;font-variant-numeric:tabular-nums}
.ft{position:absolute;left:0;top:0;pointer-events:none;font-family:var(--display);font-size:24px;text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 12px rgba(0,0,0,.4);white-space:nowrap;will-change:transform}
.banner{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;font-family:var(--display);font-size:clamp(28px,9vw,52px);
  color:var(--hazard);text-shadow:0 4px 0 #000,0 0 24px rgba(0,0,0,.5);opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;padding-inline:16px}
.banner small{display:block;font-family:var(--body);font-weight:800;font-size:14px;color:var(--ink);letter-spacing:.18em;margin-top:6px}
.banner.on{opacity:1;transform:scale(1)}
.hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);text-align:center;pointer-events:none;font-weight:800;font-size:14px;letter-spacing:.14em;
  color:rgba(255,255,255,.8);text-shadow:0 2px 0 #000;transition:opacity .5s}
.sheet{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:0 calc(env(safe-area-inset-bottom,0px) + 16px)}
.panel{pointer-events:auto;width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.titlewrap{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 7vh);text-align:center;pointer-events:none}
.title{font-family:var(--display);font-size:clamp(54px,17vw,92px);line-height:.88;margin:0;color:#fff;text-shadow:0 5px 0 var(--bad),0 10px 0 #000,0 0 40px rgba(0,0,0,.6);transform:rotate(-3deg)}
.tag{font-weight:800;letter-spacing:.3em;font-size:12px;color:var(--hazard);margin-top:14px;text-shadow:0 2px 0 #000}
.btn{font-family:var(--display);font-size:21px;letter-spacing:.03em;padding:15px 16px;border-radius:10px;border:0;cursor:pointer;background:var(--hazard);color:#1d1500;box-shadow:0 5px 0 #8f6a00;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8f6a00}
.btn.ghost{background:#24314d;color:var(--ink);box-shadow:0 5px 0 #0b1120;font-size:15px}
.btn.ghost:active{box-shadow:0 2px 0 #0b1120}
.btn:focus-visible,.iconbtn:focus-visible,.up:focus-visible{outline:3px solid #fff;outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .btn.ghost{font-size:13px;padding-inline:8px;white-space:nowrap}
.ups{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.up{display:flex;flex-direction:column;gap:3px;text-align:left;background:#1b2640;border:2px solid #2c3b5e;border-radius:10px;padding:9px 10px;color:var(--ink);cursor:pointer;font-family:var(--body)}
.up b{font-size:14px;font-weight:800}
.up small{font-size:11px;color:var(--muted);line-height:1.3}
.up .cost{display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:13px;color:var(--hazard);margin-top:3px}
.up .cost .coin{width:13px;height:13px}
.up[disabled]{opacity:.5;cursor:default}
.up .lvl{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.headrow{display:flex;justify-content:space-between;align-items:center}
.headrow h3{margin:0;font-family:var(--display);font-size:15px;letter-spacing:.04em}
h2{font-family:var(--display);font-size:clamp(30px,9vw,40px);margin:0;color:var(--hazard);text-align:center;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#1b2640;border-radius:10px;padding:9px;text-align:center}
.stat small{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:800}
.stat b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.note{margin:0;text-align:center;color:var(--muted);font-size:13px;line-height:1.4}
.flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 30px rgba(255,74,61,0)}
@media (prefers-reduced-motion:reduce){.title{transform:none}.banner{transition:none}}
</style>
</head>

  <canvas id="c"></canvas>

  <div id="labels"></div>

  <div class="hint" id="hint" hidden>DRAG LEFT AND RIGHT TO STEER</div>

      <div class="ups" id="ups"></div>
      <div class="row2"><button class="btn ghost" id="wpnBtn">WEAPON: RIFLE</button><button class="btn ghost" id="mapBtn">MAP: AUTO</button></div>
      <div class="row2"><button class="btn ghost" id="soundBtn">SOUND: ON</button><button class="btn ghost" id="gfxBtn">GRAPHICS: HIGH</button></div>
      <button class="btn ghost" id="goreBtn">BLOOD &amp; GORE: ON</button>
    </div></div>
  </div>

  <div id="pause" hidden><div class="sheet"><div class="panel">
    <h2>PAUSED</h2>
    <button class="btn" id="resumeBtn">RESUME</button>
    <div class="row2"><button class="btn ghost" id="soundBtn2">SOUND: ON</button><button class="btn ghost" id="gfxBtn2">GRAPHICS: HIGH</button></div>
    <button class="btn ghost" id="goreBtn2">BLOOD &amp; GORE: ON</button>
    <button class="btn ghost" id="quitBtn">QUIT</button>
  </div></div></div>

  <div id="win" hidden><div class="sheet"><div class="panel">
    <h2 id="winTitle">LEVEL CLEARED</h2>
    <div class="stats">
      <div class="stat"><small>KILLS</small><b id="wKills">0</b></div>
      <div class="stat"><small>SURVIVORS</small><b id="wSurv">0</b></div>
      <div class="stat"><small>COINS</small><b id="wCoins">0</b></div>
    </div>
    <button class="btn" id="nextBtn">NEXT LEVEL</button>
    <button class="btn ghost" id="winMenuBtn">ARMORY</button>
  </div></div></div>

  <div id="lose" hidden><div class="sheet"><div class="panel">
    <h2>SQUAD LOST</h2>
    <div class="stats">
      <div class="stat"><small>KILLS</small><b id="lKills">0</b></div>
      <div class="stat"><small>DISTANCE</small><b id="lDist">0%</b></div>
      <div class="stat"><small>COINS</small><b id="lCoins">0</b></div>
    </div>
    <p class="note" id="loseTip">Tip: shoot red gates to raise their number before you pass through.</p>
    <button class="btn" id="retryBtn">TRY AGAIN</button>
    <button class="btn ghost" id="loseMenuBtn">ARMORY</button>
  </div></div></div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.floor(Math.random() * a.length)];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= persistence ================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem('deadtide2.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('deadtide2.' + k, JSON.stringify(v)); } catch (e) {} }

const save = { seen: store.get('seen', []), weapon: store.get('weapon', 'rifle'), map: store.get('map', 'auto'), level: store.get('level', 1), coins: store.get('coins', 0), up: Object.assign({ dmg: 0, rate: 0, men: 0, coin: 0 }, store.get('up', {})) };
function persist() { store.set('weapon', save.weapon); store.set('map', save.map); store.set('level', save.level); store.set('coins', save.coins); store.set('up', save.up); }

/* ================= audio: recorded CC0 samples (see audio/CREDITS.md) ================= */
let goreOn = store.get('gore', true); // OFF = kid-friendly: no blood, no severed body parts
let AC = null, soundOn = store.get('sound', true), noiseBuf = null, master = null, reverbIn = null, voices = 0, ambienceSrc = null;
const SAMPLES = {
  rifle: ['rifle-1', 'rifle-2', 'rifle-3', 'rifle-4'], smg: ['smg-1', 'smg-2', 'smg-3'], minigun: ['minigun-1', 'minigun-2', 'minigun-3'],
  boom: ['boom-1', 'boom-2'], blast: ['blast-1', 'blast-2', 'blast-3'], missile: ['missile'], reload: ['reload'], shotgun: ['shotgun-1', 'shotgun-2'], pump: ['pump'], launch: ['launch'],
  moan: ['moan-1', 'moan-2', 'moan-3', 'moan-4', 'moan-5'], groan: ['groan-1', 'groan-2'], ambience: ['ambience']

const buffers = {};
function makeImpulse(secs, decay) { // outdoor-ish reverb tail built from decaying noise

}
function ensureAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }

    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = .002; comp.release.value = .22;

  } catch (e) { AC = null; }
}
function setSound(on) { soundOn = on; if (master) master.gain.setTargetAtTime(on ? .9 : 0, AC.currentTime, .05); }
// route: source -> [filter] -> gain -> pan -> master (+ reverb send)
function route(src, { vol = 1, pan = 0, rev = .15, lp = 0, hp = 0, delay = 0 } = {}) {
  let node = src;
  if (lp) { const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; node.connect(f); node = f; }
  if (hp) { const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; node.connect(f); node = f; }

}
function play(group, opt = {}) {

function synth(fn) { if (!AC || !soundOn || voices > 28) return; fn(AC.currentTime); }
function thump(freq = 55, dur = .45, vol = .5, delay = 0) { synth(t => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(freq * 1.8, t + delay); o.frequency.exponentialRampToValueAtTime(freq * .6, t + delay + dur); g.gain.setValueAtTime(vol, t + delay); g.gain.exponentialRampToValueAtTime(.0001, t + delay + dur); o.connect(g).connect(master); o.start(t + delay); o.stop(t + delay + dur + .05); }); }

function chime(freqs, step = .07, type = 'triangle', vol = .07) { synth(t => freqs.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; const t0 = t + i * step; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + .35); o.connect(g).connect(master); const r = AC.createGain(); r.gain.value = .4; g.connect(r).connect(reverbIn); o.start(t0); o.stop(t0 + .4); })); }

  ambienceSrc = AC.createBufferSource(); ambienceSrc.buffer = buffers.ambience; ambienceSrc.loop = true;

const panOf = x => clamp(x / 6, -.8, .8);
let flameNode = null;
function flameLoop(on) { // looping roar while the flamethrowers are going
  if (!AC || !noiseBuf) return;

    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = .5;

let sentT = 0, gunT = 0, miniT = 0, moanT = 1, splatT = 0, popT = 0, launchT = 0;
const sfx = {
  gun(n, hero, dt) { // squad volleys are thinned into a believable rattle; the hero's minigun is its own stream
    if (!AC) return;
    const now = AC.currentTime;
    const w = G.weapon;
    if (n > (hero ? 1 : 0) && now >= gunT && w !== 'flamer') {
      if (w === 'rocket') { gunT = now + .09; play('launch', { vol: .3, rate: rand(1.05, 1.3), pan: rand(-.4, .4) + panOf(G.sx), rev: .25, hp: 150 }); }
      else if (w === 'shotgun') { gunT = now + Math.max(.07, .2 - n * .004) * rand(.8, 1.2); play('shotgun', { vol: .26 + Math.min(.2, n * .004), rate: rand(.92, 1.08), pan: rand(-.4, .4) + panOf(G.sx), rev: .3, hp: 90 }); }
      else { gunT = now + Math.max(.05, .16 - n * .004) * rand(.8, 1.2); play(Math.random() < .7 ? 'rifle' : 'smg', { vol: .16 + Math.min(.22, n * .005), rate: rand(.9, 1.1), pan: rand(-.4, .4) + panOf(G.sx), rev: .22, hp: 120 }); }

  },
